# Curated manifest for et/cmake: https://github.com/EinsteinToolkit/ExternalLibraries-CMake
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "cmake"
owners = ["et"]
description = """
The Cactus thorn ExternalLibraries/CMake, which builds the library it bundles or uses an installed one and makes it available to other thorns. From its README: "Distribute the CMake makefile generator; see https://cmake.org/"
"""
# license: that of the library this thorn builds, CMake 3.23.2 (dist/cmake-3.23.2.tar), whose
# Copyright.txt is the 3-clause BSD license (third-party parts it ships keep their own
# licenses). The repo itself has no LICENSE or COPYING file at ET_2026_05_v0.
license = "BSD-3-Clause"
homepage = "https://github.com/EinsteinToolkit/ExternalLibraries-CMake"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "ExternalLibraries"
thorns = ["CMake"]
