# Curated manifest for et/cactusutils: https://bitbucket.org/cactuscode/cactusutils
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "cactusutils"
owners = ["et"]
description = """
CactusUtils, the Cactus arrangement of run-time utilities: termination triggers, timer reports, NaN checking, system topology and statistics, Formaline (source and parameter archiving), Vectors (SIMD), WatchDog and more.
"""
# license: left unset. At ET_2026_05_v0 (fddaed6), the repo has no LICENSE or COPYING file at
# its root; 10 of its 16 thorns carry its own: the GNU GPL version 2 text (5); the GNU LGPL
# version 2 text (1); the GNU LGPL version 2.1 text (4); the thorn READMEs say 'GPL', 'GPLv2+',
# 'LGPL', 'LGPLv2.1 or later'; so no single SPDX identifier covers the repo.
homepage = "https://bitbucket.org/cactuscode/cactusutils"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "CactusUtils"
