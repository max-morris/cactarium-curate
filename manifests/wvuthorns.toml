# Curated manifest for et/wvuthorns: https://bitbucket.org/zach_etienne/wvuthorns
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "wvuthorns"
owners = ["et"]
description = """
WVUThorns, Zachariah Etienne's thorns from West Virginia University: Baikal and BaikalVacuum (BSSN evolution in C code generated by NRPy+, with and without the stress-energy source terms), GiRaFFE (general relativistic force-free electrodynamics) with GiRaFFEfood (its initial data and code tests) and the variable converters GiRaFFE_to_HydroBase and ID_converter_GiRaFFE, FishboneMoncriefID (accretion disk initial data around a spinning black hole), ShiftedKerrSchild (Kerr-Schild initial data with a shifted radial coordinate) and Seed_Magnetic_Fields (seeds weak magnetic fields into initial data). It also keeps the original IllinoisGRMHD, which its README says has moved to GRHayLET, and the IllinoisGRMHD converters Convert_to_HydroBase and ID_converter_ILGRMHD, which no longer compile any source.
"""
# license: left unset. At ET_2026_05_v0 (7802e89), the repo has no LICENSE or COPYING file at
# its root; 10 of its 12 thorns carry their own: a BSD 2-Clause license (7); a notice granting
# the GNU GPL version 2 or later, with the GPL version 2 text (2); the GNU GPL version 2 text
# (1); the thorn READMEs say 'BSD 2-Clause', 'FreeBSD License, AKA "2-Clause BSD License"', 'GNU
# General Public License, version 2 or higher', and IllinoisGRMHD's 'GPLv2 for HARM
# Conservative-to-Primitive solver (src/harm_*), GPLv2+ for all other code'; so no single SPDX
# identifier covers the repo.
homepage = "https://bitbucket.org/zach_etienne/wvuthorns"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
# Not published, since it can't build: it has moved to et/grhaylet, whose IllinoisGRMHD the ET builds, and two thorns of one name cannot be built together.
exclude-thorns = ["IllinoisGRMHD"]
arrangement = "WVUThorns"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/cactusbase"
needs = ["Boundary", "CartGrid3D"]
needed-by = ["Baikal", "BaikalVacuum", "FishboneMoncriefID", "GiRaFFE", "GiRaFFE_to_HydroBase",
    "GiRaFFEfood", "ID_converter_GiRaFFE", "Seed_Magnetic_Fields", "ShiftedKerrSchild"]

[[dependency]]
target = "et/cactusnumerical"
needs = ["MoL", "SpaceMask"]
needed-by = ["Baikal", "BaikalVacuum", "GiRaFFE", "GiRaFFEfood", "ID_converter_GiRaFFE"]

[[dependency]]
target = "et/einsteinbase"
needs = ["ADMBase", "HydroBase", "TmunuBase"]
needed-by = ["Baikal", "BaikalVacuum", "FishboneMoncriefID", "GiRaFFE", "GiRaFFE_to_HydroBase",
    "GiRaFFEfood", "ID_converter_GiRaFFE", "Seed_Magnetic_Fields", "ShiftedKerrSchild"]

[[dependency]]
target = "et/einsteinevolve"
needs = ["NewRad"]
needed-by = ["Baikal", "BaikalVacuum"]

[[dependency]]
target = "et/gsl"
needs = ["GSL"]
needed-by = ["GiRaFFEfood"]
