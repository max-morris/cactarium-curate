# Curated manifest for et/kranc: https://github.com/ianhinder/Kranc
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "kranc"
owners = ["et"]
description = """
Kranc's Cactus thorn KrancNumericalTools/GenericFD: the finite-differencing support code that thorns generated by Kranc (McLachlan, WeylScal4 and others) compile against. Kranc itself is a set of Mathematica scripts that turn systems of time evolution PDEs into Cactus thorns; this package publishes only the thorn that generated code needs at build time.
"""
# license: the repo root's COPYING is the GNU GPL version 2 text, and the source headers (e.g.
# Tools/CodeGen/KrancThorn.m) grant version 2 "or (at your option) any later version", at
# ET_2026_05_v0 (b4b2b40).
license = "GPL-2.0-or-later"
homepage = "https://github.com/ianhinder/Kranc"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
# The thorn lives at Auxiliary/Cactus/KrancNumericalTools/GenericFD, as the ET thornlist's
# !REPO_PATH = Auxiliary/Cactus says.
root = "Auxiliary/Cactus"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/cactusbase"
needs = ["SymBase"]
