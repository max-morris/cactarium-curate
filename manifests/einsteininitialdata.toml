# Curated manifest for et/einsteininitialdata: https://bitbucket.org/einsteintoolkit/einsteininitialdata
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "einsteininitialdata"
owners = ["et"]
description = """
EinsteinInitialData, the Einstein Toolkit arrangement of initial data thorns: TwoPunctures and TwoPuncturesX (binary black holes), TOVSolver and TOVola (neutron stars), the Meudon (LORENE) readers, exact solutions, Hydro_RNSID, NoExcision and more.
"""
# license: left unset. At ET_2026_05_v0 (fee29aa), the repo has no LICENSE or COPYING file at
# its root; 9 of its 21 thorns carry its own: a BSD 2-Clause license (1); a license text (You
# can use this code under the GPL Gene...) (2); the GNU GPL version 2 text (6); the thorn
# READMEs say 'BSD-2', 'GPL', 'GPLv2+', 'LGPL', 'LGPLv2+'; so no single SPDX identifier covers
# the repo.
homepage = "https://bitbucket.org/einsteintoolkit/einsteininitialdata"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "EinsteinInitialData"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/cactusbase"
needs = ["Boundary", "CartGrid3D", "Fortran", "IOUtil"]
needed-by = ["DistortedBHIVP", "Exact", "Hydro_InitExcision", "Hydro_RNSID", "IDAnalyticBH",
    "IDAxiBrillBH", "IDAxiOddBrillBH", "IDBrillData", "IDConstraintViolate", "IDFileADM",
    "IDLinearWaves", "Meudon_Bin_BH", "Meudon_Bin_NS", "Meudon_Mag_NS", "NoExcision",
    "ReadInterpolate", "RotatingDBHIVP", "TOVola", "TOVSolver", "TwoPunctures"]

[[dependency]]
target = "et/cactuselliptic"
needs = ["EllBase"]
needed-by = ["IDBrillData"]

[[dependency]]
target = "et/cactusnumerical"
needs = ["SpaceMask", "SummationByParts"]
needed-by = ["Hydro_InitExcision", "Hydro_RNSID", "Meudon_Bin_BH", "Meudon_Bin_NS", "TOVSolver"]

[[dependency]]
target = "et/carpet"
needs = ["Carpet"]
needed-by = ["ReadInterpolate"]

[[dependency]]
target = "et/carpetx"
needs = ["ADMBaseX", "CoordinatesX"]
needed-by = ["TwoPuncturesX"]

[[dependency]]
target = "et/einsteinbase"
needs = ["ADMBase", "Constants", "CoordGauge", "EOS_Base", "HydroBase", "StaticConformal"]
needed-by = ["DistortedBHIVP", "Exact", "Hydro_InitExcision", "Hydro_RNSID", "IDAnalyticBH",
    "IDAxiBrillBH", "IDAxiOddBrillBH", "IDBrillData", "IDConstraintViolate", "IDFileADM",
    "IDLinearWaves", "Meudon_Bin_BH", "Meudon_Bin_NS", "Meudon_Mag_NS", "NoExcision",
    "RotatingDBHIVP", "TOVola", "TOVSolver", "TwoPunctures"]

[[dependency]]
target = "et/grhayl"
needs = ["GRHayLib"]
needed-by = ["TOVola"]

[[dependency]]
target = "et/gsl"
needs = ["GSL"]
needed-by = ["TOVola", "TwoPunctures", "TwoPuncturesX"]

[[dependency]]
target = "et/hdf5"
needs = ["HDF5"]
needed-by = ["Hydro_RNSID", "ReadInterpolate", "TOVola"]

[[dependency]]
target = "et/lorene"
needs = ["LORENE"]
needed-by = ["Meudon_Bin_BH", "Meudon_Bin_NS", "Meudon_Mag_NS"]

[[dependency]]
target = "et/cactusnumerical"
needs = ["SphericalSurface"]
needed-by = ["NoExcision"]
