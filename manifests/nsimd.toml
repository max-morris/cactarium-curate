# Curated manifest for et/nsimd: https://github.com/EinsteinToolkit/ExternalLibraries-NSIMD
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "nsimd"
owners = ["et"]
description = """
The Cactus thorn ExternalLibraries/NSIMD, which builds the library it bundles or uses an installed one and makes it available to other thorns. From its README: ""
"""
# license: that of the library this thorn builds, NSIMD 3.0.1 (dist/nsimd-3.0.1.tar), whose
# LICENSE is the MIT license (the SLEEF sources it also bundles, dist/sleef.zip, are under
# BSL-1.0). The repo itself has no LICENSE or COPYING file at ET_2026_05_v0.
license = "MIT"
homepage = "https://github.com/EinsteinToolkit/ExternalLibraries-NSIMD"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "ExternalLibraries"
thorns = ["NSIMD"]
