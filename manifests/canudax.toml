# Curated manifest for et/canudax: https://bitbucket.org/canuda/canudax
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "canudax"
owners = ["et"]
description = """
CanudaX, a collection of GPU-accelerated thorns for dynamical spacetime simulations in the BSSN formalism, based on the Canuda library for the Einstein Toolkit and built on the CarpetX driver: CanudaX_BSSNMoL (BSSN evolution), CanudaX_NPScalars (Psi4) and CanudaX_ExactID (Kerr, Teukolsky waves and Apples-with-Apples initial data).
"""
# license: left unset. At ET_2026_05_v0 (0a54a1b), the repo has no LICENSE or COPYING file at
# its root; the thorn READMEs say 'GPL', 'GPLv2+'; so no single SPDX identifier covers the repo.
homepage = "https://bitbucket.org/canuda/canudax"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "CanudaX"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/carpetx"
needs = ["ADMBaseX", "CarpetXRegrid", "Loop", "TmunuBaseX"]
