# Curated manifest for et/carpet: https://github.com/einsteintoolkit/Carpet
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "carpet"
owners = ["et"]
description = """
Carpet, the arrangement that provides a parallel adaptive mesh refinement driver for Cactus, with its I/O, reduction, interpolation, regridding and test thorns.
"""
# license: from the repo's root COPYING at ET_2026_05_v0 (6ddf4c7): the GNU GPL version 2 text
# with no 'or (at your option) any later version' grant, and the arrangement README states none,
# so GPL-2.0-only for the whole package. Thorns that say otherwise: most thorn READMEs say
# 'GPLv2+'; CarpetIONirvana, Nirvana and TestLoopControl say LGPL; Timers says 'n/a'. The 17
# thorns with their own COPYING carry the same GPL v2 text.
license = "GPL-2.0-only"
homepage = "https://github.com/einsteintoolkit/Carpet"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
# Not published, since they can't build: they need an F5 library that no public thorn provides.
exclude-thorns = ["CarpetIOF5", "CarpetIOF5_standalone"]
arrangement = "Carpet"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/cactusbase"
needs = ["Boundary", "CartGrid3D", "CoordBase", "Fortran", "IOUtil", "SymBase"]
needed-by = ["AMRToy", "Carpet", "CarpetIntegrateTest", "CarpetIOASCII", "CarpetIOBasic",
    "CarpetIOHDF5", "CarpetIONirvana", "CarpetIOScalar", "CarpetIOStreamedHDF5",
    "CarpetLib", "CarpetMask", "CarpetMG", "CarpetPETSc", "CarpetProlongateTest",
    "CarpetReduce", "CarpetRegridTest", "LoopControl", "PeriodicCarpet", "ReductionTest",
    "ReductionTest3", "Requirements", "TestLoopControl", "Timers"]

[[dependency]]
target = "et/cactusconnect"
needs = ["Socket"]
needed-by = ["CarpetIOStreamedHDF5"]

[[dependency]]
target = "et/cactuselliptic"
needs = ["TATelliptic"]
needed-by = ["CarpetCG", "CarpetJacobi", "CarpetMG"]

[[dependency]]
target = "et/cactusnumerical"
needs = ["MoL", "SphericalSurface"]
needed-by = ["CarpetEvolutionMask", "CarpetMask", "CarpetTracker"]

[[dependency]]
target = "et/cactusutils"
needs = ["Vectors"]
needed-by = ["CarpetLib"]

[[dependency]]
target = "et/einsteinevolve"
needs = ["GRHydro"]
needed-by = ["ReductionTest"]

[[dependency]]
target = "et/hdf5"
needs = ["HDF5"]
needed-by = ["CarpetIOHDF5", "CarpetIONirvana", "Nirvana"]

[[dependency]]
target = "et/mpi"
needs = ["MPI"]
needed-by = ["Carpet", "CarpetInterp", "CarpetLib", "CarpetReduce"]

[[dependency]]
target = "et/petsc"
needs = ["PETSc"]
needed-by = ["CarpetPETSc"]
