# Curated manifest for et/blas: https://github.com/EinsteinToolkit/ExternalLibraries-BLAS
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "blas"
owners = ["et"]
description = """
The Cactus thorn ExternalLibraries/BLAS, which builds the library it bundles or uses an installed one and makes it available to other thorns. From its README: "Distribute the Basic Linear Algebra Subroutines (BLAS); see http://netlib.org/blas/."
"""
# license: that of the library this thorn builds, reference LAPACK 3.12.0
# (dist/lapack-3.12.0.tgz), which provides the reference BLAS, and whose LICENSE is the modified
# BSD license SPDX lists as BSD-3-Clause-Open-MPI. The repo itself has no LICENSE or COPYING
# file at ET_2026_05_v0.
license = "BSD-3-Clause-Open-MPI"
homepage = "https://github.com/EinsteinToolkit/ExternalLibraries-BLAS"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "ExternalLibraries"
thorns = ["BLAS"]
