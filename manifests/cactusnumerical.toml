# Curated manifest for et/cactusnumerical: https://bitbucket.org/cactuscode/cactusnumerical
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "cactusnumerical"
owners = ["et"]
description = """
CactusNumerical, the Cactus arrangement of numerical infrastructure: the method of lines (MoL), dissipation, local interpolation and reduction, reflection, rotating and periodic symmetries, slabbing, the space mask, spherical surfaces, summation-by-parts operators and tests.
"""
