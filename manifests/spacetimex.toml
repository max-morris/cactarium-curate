# Curated manifest for et/spacetimex: https://github.com/EinsteinToolkit/SpacetimeX
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "spacetimex"
owners = ["et"]
description = """
SpacetimeX, a collection of thorns that prepare initial data for, evolve and analyze the spacetime metric, built on CarpetX: Z4c, the CarpetX ports of AHFinderDirect, SphericalSurface, Multipole and PunctureTracker, NewRadX, Weyl, TwoPuncturesX and more. For matter evolution see AsterX.
"""
# license: from the repo's root LICENSE.md at ET_2026_05_v0 (e89fe1d): the GNU LGPL version 3
# text with no 'or later' grant, and the README states none, so LGPL-3.0-only for the whole
# package. Thorns that carry a different license: AHFinderDirect and SphericalSurface have their
# own COPYING, the GNU GPL version 2 text.
license = "LGPL-3.0-only"
homepage = "https://github.com/EinsteinToolkit/SpacetimeX"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
arrangement = "SpacetimeX"

# Dependencies, from the CCL of the thorns at 2026.5.0: for each requirement
# this package doesn't meet itself, the package and thorns that meet it (needs), and the thorns
# that have it (needed-by, left out when all do).

[[dependency]]
target = "et/amrex"
needs = ["AMReX"]
needed-by = ["Punctures"]

[[dependency]]
target = "et/cactusbase"
needs = ["IOUtil"]
needed-by = ["AHFinderDirect", "Multipole"]

[[dependency]]
target = "et/carpetx"
needs = ["ADMBaseX", "Arith", "BoxInBox", "CarpetX", "CarpetXRegrid", "CoordinatesX", "Loop",
    "TmunuBaseX"]
needed-by = ["AHFinderDirect", "AHFinderX", "BrillLindquist", "KerrSchildX", "Multipole", "NewRadX",
    "Punctures", "PunctureTracker", "SphericalHarmonics", "SphericalSurface",
    "StaticTrumpet", "TestNewRadX", "TwoPuncturesX", "Weyl", "WeylScal4", "Z4c"]

[[dependency]]
target = "et/gsl"
needs = ["GSL"]
needed-by = ["TwoPuncturesX"]

[[dependency]]
target = "et/hdf5"
needs = ["HDF5"]
needed-by = ["SphericalHarmonics"]

[[dependency]]
target = "et/mpi"
needs = ["MPI"]
needed-by = ["PunctureTracker"]

[[dependency]]
target = "et/ssht"
needs = ["ssht"]
needed-by = ["AHFinderX", "SphericalHarmonics"]

[[dependency]]
target = "et/carpetx"
needs = ["CarpetX"]
needed-by = ["AHFinderDirect", "AHFinderX", "Multipole", "PunctureTracker"]
