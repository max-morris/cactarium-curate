# Curated manifest for et/grhayl: https://github.com/GRHayL/GRHayL
# Kept on the Cactarium until the repo's maintainers commit their own cactarium.toml.
format = 1

[package]
name = "grhayl"
owners = ["et"]
description = """
GRHayL, the General Relativistic Hydrodynamic Library: an infrastructure-agnostic magnetohydrodynamics library for modular development of GRMHD codes, divided into independent modules ("gems") built on the core GRHayL_Core: Atmosphere, Con2Prim, EOS, Flux_Source, Induction, Neutrinos and Reconstruction. Its one Cactus thorn, GRHayLib, provides the library in the Cactus framework.
"""
# license: from the repo's root LICENSE at ET_2026_05_v0 (66e23f5): the BSD 2-Clause license,
# so BSD-2-Clause for the whole package. Parts that say otherwise: the Noble con2prim sources
# (GRHayL/Con2Prim/Hybrid/Noble) grant the GNU GPL 'version 2 of the License, or (at your
# option) any later version', and GRHayLib's README puts the Palenzuela and Newman con2prim
# routines under the Creative Commons Attribution-ShareAlike 4.0 license.
license = "BSD-2-Clause"
homepage = "https://github.com/GRHayL/GRHayL"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
# Release tags: the Einstein Toolkit's ET_YYYY_MM_vN tags are versions YYYY.M.N, from
# ET_2026_05_v0 (2026.5.0) on.
tag-pattern = "ET_{major}_{minor}_v{patch}"
since = "2026.5.0"
# The thorn sits at implementations/GRHayLib (its src/ links into the library sources under
# GRHayL/); the Einstein Toolkit checks it out as GRHayL/GRHayLib (!REPO_PATH = implementations/$2).
arrangement = "GRHayL"
thorns = ["GRHayLib"]

# Dependencies, from the CCL of the thorns at 2026.5.0: where each
# requirement this package does not meet itself comes from. needed-by is left out where
# every thorn needs it.

[[dependency]]
target = "et/hdf5"
