# Curated packages for the Cactarium, for `cactarium curate curate.toml`.
#
# One package per Einstein Toolkit repo whose thorns et/carpet-stack, et/carpetx-stack (both tracks)
# and et/cottonmouth-stack build or fetch, plus AsterX, and thirteen repos added so that every
# curated thorn's requirements have a curated provider: cactusconnect, cactuselliptic, cactuspugh,
# einsteineos, einsteinevolve, einsteinutils, GRHayL, Kranc and the ExternalLibraries FFTW3, LORENE,
# OpenCL, pthreads and ssht. Seven more repos are here so that sims built on the Einstein Toolkit's
# thornlist can be fully specified by packages: cactuswave, mclachlan, wvuthorns,
# wvuthorns_diagnostics, GRHayLET, and the FUKA thorns KadathImporter and KadathThorn (which also
# needs the FUKA library's source checked out inside it, at src/fuka, which isn't a thorn). The
# flesh is et/cactus, a flesh package (flesh = true) rather than thorns. Left out: Cottonmouth (a real package, from its own cactarium.toml). Each manifest is a
# cactarium.toml as the repo would hold it; these stay curated until the maintainers commit their
# own. Each manifest carries its release-tag rule (tag-pattern, since): the ET release tags become
# versions (ET_2026_05_v0 is 2026.5.0), from 2026.5.0 on. AsterX's versions follow its own
# v{major}.{minor} tags. ssht, which has no release tags, has one version given by commit here.
# Paths are relative to this file.

